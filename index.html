<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <!-- iOS Safari blocks Fullscreen API on iPhone; these flags let "Add to
         Home Screen" run the page truly chromeless. -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Shih Tzu City Adventure</title>
    <script>
        // Tag the document as a touch device before stylesheets are applied so
        // the touch styles win on first paint (no flash of desktop layout).
        if ('ontouchstart' in window
            || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0)
            || (navigator.msMaxTouchPoints && navigator.msMaxTouchPoints > 0)) {
            document.documentElement.classList.add('is-touch');
        }
    </script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            font-family: 'Segoe UI', Arial, sans-serif;
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        h1 {
            margin: 12px 0 6px;
            letter-spacing: 1px;
        }
        #game {
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }
        .controls {
            margin-top: 10px;
            font-size: 14px;
            opacity: 0.85;
            text-align: center;
        }
        .controls kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            border: 1px solid #555;
            font-family: monospace;
        }

        /* ---- Virtual gamepad (touch devices only) ---- */
        #touch-pad {
            display: none;
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 10;
            user-select: none;
            -webkit-user-select: none;
        }
        #touch-pad button {
            pointer-events: auto;
            position: absolute;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.45);
            color: #fff;
            font-size: 30px;
            font-weight: bold;
            border-radius: 50%;
            width: 72px;
            height: 72px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-backdrop-filter: blur(4px);
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
            opacity: 0.75;
        }
        #touch-pad button:active {
            background: rgba(255, 255, 255, 0.4);
            opacity: 1;
        }
        #btn-left  { left: 20px;  bottom: 28px; }
        #btn-right { left: 110px; bottom: 28px; }
        #btn-jump  { right: 20px; bottom: 28px; }
        #btn-roar  {
            right: 110px;
            bottom: 28px;
            background: rgba(255, 80, 80, 0.28);
            border-color: rgba(255, 130, 130, 0.55);
            font-size: 22px;
        }

        /* ---- Rotate-to-landscape overlay ---- */
        #rotate-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: #1a1a2e;
            color: #fff;
            z-index: 1000;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 20px;
            padding: 32px;
        }
        #rotate-overlay .icon {
            font-size: 72px;
            margin-bottom: 16px;
            display: inline-block;
            animation: rotate-hint 1.8s ease-in-out infinite;
        }
        @keyframes rotate-hint {
            0%, 40%   { transform: rotate(0deg); }
            70%, 100% { transform: rotate(90deg); }
        }

        /* Touch-device styles. Gated on a `.is-touch` class set by JS via
           feature detection — `(hover: none) and (pointer: coarse)` looked
           tidy but proved unreliable on Chrome Android (varies with stylus,
           paired peripherals, and Desktop-site mode). `100dvh` (dynamic
           viewport) keeps the canvas sized to the *currently visible* area on
           iOS Safari, so the game stays fully on-screen as the nav bar
           shows/hides. */
        html.is-touch body { justify-content: center; }
        html.is-touch h1,
        html.is-touch .controls { display: none; }
        html.is-touch #game {
            box-shadow: none;
            border-radius: 0;
            width: 100vw;
            height: 100vh;       /* fallback */
            height: 100dvh;
        }
        html.is-touch #touch-pad { display: block; }

        /* Fullscreen toggle (top-right corner). Smaller than gamepad buttons. */
        #btn-fs {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 44px;
            height: 44px;
            font-size: 20px;
            background: rgba(255, 255, 255, 0.18);
            border: 2px solid rgba(255, 255, 255, 0.45);
            color: #fff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            pointer-events: auto;
            opacity: 0.75;
        }
        #btn-fs:active { background: rgba(255, 255, 255, 0.4); opacity: 1; }
        /* Touch device held in portrait — block play, prompt rotation */
        @media (orientation: portrait) {
            html.is-touch #rotate-overlay { display: flex; }
        }
    </style>
</head>
<body>
    <h1>Shih Tzu City Adventure</h1>
    <div id="game"></div>
    <div class="controls">
        Move: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> or <kbd>A</kbd>/<kbd>D</kbd> &nbsp;&middot;&nbsp;
        Jump: <kbd>&uarr;</kbd>, <kbd>Space</kbd>, or <kbd>W</kbd> &nbsp;&middot;&nbsp;
        Roar: <kbd>R</kbd> &nbsp;&middot;&nbsp;
        Avoid the birds and dogs!
    </div>

    <div id="touch-pad" aria-hidden="true">
        <button id="btn-left"  data-input="left"  aria-label="Move left">&#9664;</button>
        <button id="btn-right" data-input="right" aria-label="Move right">&#9654;</button>
        <button id="btn-roar"  data-input="r"     aria-label="Roar">R</button>
        <button id="btn-jump"  data-input="up"    aria-label="Jump">&#9650;</button>
        <button id="btn-fs"    aria-label="Fullscreen">&#9974;</button>
    </div>

    <div id="rotate-overlay">
        <div>
            <div class="icon">&#128241;</div>
            <div>Please rotate your device to landscape</div>
        </div>
    </div>

    <script>
        // Shared with game.js. `held` covers continuous input (left/right);
        // `justPressed` is edge-triggered for one-shot actions (jump, roar).
        window.virtualInput = { left: false, right: false, up: false, r: false };
        window.virtualInputJustPressed = { up: false, r: false };

        (function () {
            const pad = document.getElementById('touch-pad');
            if (!pad) return;
            pad.querySelectorAll('button[data-input]').forEach((btn) => {
                const key = btn.dataset.input;
                const press = (e) => {
                    e.preventDefault();
                    if (!window.virtualInput[key]) {
                        if (window.virtualInputJustPressed[key] !== undefined) {
                            window.virtualInputJustPressed[key] = true;
                        }
                    }
                    window.virtualInput[key] = true;
                };
                const release = (e) => {
                    e.preventDefault();
                    window.virtualInput[key] = false;
                };
                btn.addEventListener('touchstart', press, { passive: false });
                btn.addEventListener('touchend', release, { passive: false });
                btn.addEventListener('touchcancel', release, { passive: false });
                btn.addEventListener('mousedown', press);
                btn.addEventListener('mouseup', release);
                btn.addEventListener('mouseleave', release);
            });

            // Fullscreen toggle. iPhone Safari has neither
            // `requestFullscreen` nor `webkitRequestFullscreen` on the
            // document element, so the button is a no-op there — `100dvh` and
            // the "Add to Home Screen" PWA flags handle that case instead.
            const fsBtn = document.getElementById('btn-fs');
            if (fsBtn) {
                const enter = () => {
                    const el = document.documentElement;
                    const req = el.requestFullscreen
                        || el.webkitRequestFullscreen
                        || el.msRequestFullscreen;
                    if (req) {
                        const p = req.call(el);
                        // Try to lock landscape once we're in fullscreen.
                        const lockLandscape = () => {
                            if (screen.orientation && screen.orientation.lock) {
                                screen.orientation.lock('landscape').catch(() => {});
                            }
                        };
                        if (p && typeof p.then === 'function') {
                            p.then(lockLandscape).catch(() => {});
                        } else {
                            lockLandscape();
                        }
                    }
                };
                const exit = () => {
                    const exitFn = document.exitFullscreen
                        || document.webkitExitFullscreen
                        || document.msExitFullscreen;
                    if (exitFn) exitFn.call(document);
                };
                fsBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    const isFs = document.fullscreenElement
                        || document.webkitFullscreenElement;
                    if (isFs) exit(); else enter();
                });
            }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
